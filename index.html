<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <title>Kaimono</title>

        <!-- CSS -->
        <link href="css/style.css" rel="stylesheet">
    </head>
    <body>
        <header>
            <h1>今日の買い物</h1>
        </header>
        
        <main>
            <section>
                <!-- ラベル選択か新規入力で買い物リストに買うものを追加 -->
                <input id="itemInput" type="text" onkeyup="if(event.key==='Enter') addItem()">
                <button onclick="addItem()">追加</button>
            </section>
            <section>
                <!-- ここは自動的に追加された買うものを表示 -->
                <ul id="itemList"></ul>
            </section>
            <section>
                <!-- お金のログ画面へ遷移するボタン -->
                <button onclick="show('payment')">支払い登録</button>
            </section>
        </main>

        <footer>
            <script>
                function addItem() {
                    const input = document.getElementById("itemInput");
                    if (!input.value.trim())
                        return;
                    const li = document.createElement("li");

                    const checkbox = document.createElement("input");
                    checkbox.type = "checkbox";

                    const span = document.createElement("span");
                    span.textContent = input.value;

                    document.getElementById("itemList").appendChild(li);
                    li.appendChild(checkbox);
                    li.appendChild(span);

                    checkbox.onchange = () => {
                        li.classList.toggle("Done", checkbox.checked);
                    }

                    const deletBtn = document.createElement("button");
                    deletBtn.textContent = "x";
                    deletBtn.onclick = () => {
                        li.remove();
                    };
                    li.appendChild(deletBtn);

                    input.value = "";
                }
            </script>
        </footer>
    </body>
</html>

<!-- 
    追加した項目をクリックで削除できるようにする

チェック（買った／まだ）を付ける

ラベル化するかどうかのUIを横に足す
-->
